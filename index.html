function truncate(str, len=10) { return str.length > len ? str.slice(0, len) + "…" : str; }

function openModal(ev) {
  document.getElementById("modalTitle").textContent = ev.name;
  document.getElementById("modalBody").innerHTML = `
    <div>${ev.year}/${pad(ev.month)}/${pad(ev.day)} (${prefs[new Date(ev.year, ev.month-1, ev.day).getDay()]}) ${ev.timeband}</div>
    <div>⏰ ${ev.time}</div>
    <div>📍 ${ev.place}</div>
    <div>💰 ${ev.fee}</div>
  `;
  const link = document.getElementById("modalLink");
  if (ev.url) {
    link.href = ev.url;
    link.style.display = "inline-block";
  } else {
    link.style.display = "none";
  }
  document.getElementById("modal").classList.add("open");
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

function setupShare() {
  const text = encodeURIComponent(SHARE_TEXT);
  const url = encodeURIComponent(SHARE_URL);
  document.getElementById("shareX").href = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
  document.getElementById("shareLine").href = `https://social-plugins.line.me/lineit/share?url=${url}`;
  document.getElementById("shareFB").href = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
}

function render() {
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const monthEvents = EVENTS.filter(e =>
    e.year === currentYear && e.month === currentMonth + 1 &&
    (filterPref === "all" || e.pref === filterPref)
  );

  document.getElementById("currentMonth").textContent = `${currentYear}年${currentMonth + 1}月`;

  const cal = document.getElementById("calendar");
  cal.innerHTML = "";
  prefs.forEach((d, i) => {
    const el = document.createElement("div");
    el.className = "day-header" + (i === 0 ? " sun" : i === 6 ? " sat" : "");
    el.textContent = d;
    cal.appendChild(el);
  });

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day-cell empty";
    cal.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement("div");
    const date = new Date(currentYear, currentMonth, d);
    const dow = date.getDay();
    cell.className = "day-cell" + (dow === 0 ? " sun" : dow === 6 ? " sat" : "");
    const num = document.createElement("div");
    num.className = "day-num";
    num.textContent = d;
    cell.appendChild(num);

    monthEvents.filter(e => e.day === d).forEach(ev => {
      const chip = document.createElement("div");
      chip.className = `event-chip ${ev.pref}`;
      chip.textContent = truncate(ev.name, 8);
      chip.title = ev.name;
      chip.onclick = (e) => { e.stopPropagation(); openModal(ev); };
      cell.appendChild(chip);
    });
    cal.appendChild(cell);
  }

  const list = document.getElementById("listView");
  list.innerHTML = "";
  const sorted = [...monthEvents].sort((a, b) => a.day - b.day);
  if (sorted.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:var(--muted);padding:2rem;">この月のイベントはありません</p>';
  } else {
    sorted.forEach(ev => {
      const card = document.createElement("div");
      card.className = `event-card ${ev.pref}`;
      card.innerHTML = `
        <h3>${ev.name}</h3>
        <div class="meta">${ev.year}/${pad(ev.month)}/${pad(ev.day)} (${prefs[new Date(ev.year, ev.month-1, ev.day).getDay()]}) ${ev.timeband}</div>
        <div class="meta">⏰ ${ev.time}　📍 ${ev.place}</div>
        <div class="meta">💰 ${ev.fee}</div>
        ${ev.url ? `<div><a href="${ev.url}" target="_blank" rel="noopener">詳細・参加情報を見る →</a></div>` : ""}
      `;
      list.appendChild(card);
    });
  }

  document.getElementById("updated").textContent = new Date().toLocaleString("ja-JP");
}

document.getElementById("prevMonth").onclick = () => {
  currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } render();
};
document.getElementById("nextMonth").onclick = () => {
  currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } render();
};
document.querySelectorAll(".pref-filter .btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".pref-filter .btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    filterPref = btn.dataset.pref;
    render();
  };
});
document.getElementById("toggleView").onclick = () => {
  listMode = !listMode;
  document.getElementById("calendar").style.display = listMode ? "none" : "grid";
  document.getElementById("listView").style.display = listMode ? "block" : "none";
  document.getElementById("toggleView").textContent = listMode ? "カレンダー表示" : "リスト表示";
};
document.getElementById("modalClose").onclick = closeModal;
document.getElementById("modal").onclick = (e) => { if (e.target.id === "modal") closeModal(); };

document.getElementById("copyLink").onclick = () => {
  navigator.clipboard.writeText(location.href).then(() => {
    showToast("リンクをコピーしました");
  }).catch(() => {
    showToast("コピーに失敗しました");
  });
};

setupShare();

const today = new Date();
currentYear = today.getFullYear();
currentMonth = today.getMonth();
render();
</script>
</body>
